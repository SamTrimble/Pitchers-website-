[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athleteos-backend"
version = "0.1.0"
description = "Phase 0 backend foundation for AthleteOS"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.51.0",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "psycopg==3.3.4"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
warn_unused_configs = true
mypy_path = "."
exclude = ["migrations/"]
